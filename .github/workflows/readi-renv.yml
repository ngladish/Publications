name: ReADI renv + render check

on:
  push:
    paths:
      - "Gladish_2025_ReADI_Creation/**"
      - ".github/workflows/readi-renv.yml"
  pull_request:
    paths:
      - "Gladish_2025_ReADI_Creation/**"
      - ".github/workflows/readi-renv.yml"

jobs:
  readi-check:
    name: R ${{ matrix.r-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        r-version: ["4.4.1"]

    env:
      RENV_CONFIG_INSTALL_FROM_SOURCE: "never"
      R_KEEP_PKG_SOURCE: "no"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install renv
        run: R -q -e 'install.packages("renv", repos = "https://cloud.r-project.org")'

      - name: Restore renv library
        working-directory: Gladish_2025_ReADI_Creation
        run: R -q -e 'renv::restore(prompt = FALSE)'

      - name: Render ReADI analysis
        working-directory: Gladish_2025_ReADI_Creation
        run: R -q -e 'rmarkdown::render("Analysis.Rmd")'