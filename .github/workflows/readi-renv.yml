name: ReADI renv + render check

on:
  push:
    paths:
      - "Gladish_2025_ReADI_Creation/**"
      - ".github/workflows/readi-renv.yml"
  pull_request:
    paths:
      - "Gladish_2025_ReADI_Creation/**"
      - ".github/workflows/readi-renv.yml"

jobs:
  readi-check:
    name: R ${{ matrix.r-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        r-version: ["4.5.0"]

    env:
      RENV_CONFIG_INSTALL_FROM_SOURCE: "never"
      R_KEEP_PKG_SOURCE: "no"
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      # ----- OS-specific system libraries -----

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install udunits gdal proj geos

      # Windows usually has CRAN binaries for units/sf; no extra system deps here

      # ----- R/renv steps -----

      - name: Install renv
        run: Rscript -e "install.packages('renv', repos = 'https://cloud.r-project.org')"

      - name: Restore renv library
        working-directory: Gladish_2025_ReADI_Creation
        run: Rscript -e "renv::restore(prompt = FALSE)"

      - name: Render ReADI analysis
        working-directory: Gladish_2025_ReADI_Creation
        run: Rscript -e "rmarkdown::render('Analysis.Rmd')"